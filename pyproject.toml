[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transip-dns-updater"
version = "0.1.0"
description = "Python DNS updater for TransIP"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "cemmetje87"},
]
dependencies = [
    "requests>=2.25.1",
    "python-transip>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
transip-dns-updater = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
